# D435i + Livox Mid-360 profile.  This is a separate sensor chain from the
# Generic USB camera profile.  The transform convention is
# p_camera = R_lidar_to_camera @ p_lidar + t.
camera_projection:
  calibration_status: extrinsics_only
  calibration_version: 1
  sensor_model: intel_realsense_d435i
  extrinsics_source: real_robot/calibration/orin26_d435i_mid360_targetless_v009_r009_extrinsics.json
  sensor_topics:
    rgb: /camera/color/image_raw
    camera_info: /camera/color/camera_info
    lidar: /cloud_registered
    odom: /aft_mapped_to_init
  frame_ids:
    lidar: livox_frame
    camera_optical: veocc_d435i_color_optical_frame
    base: base
  # Positive means RGB timestamp minus LiDAR timestamp.  The supplied JSON
  # has no measured time offset; zero is an explicit, unvalidated assumption.
  rgb_minus_lidar_time_offset_s: 0.0
  time_offset_status: assumed_zero_unvalidated
  time_offset_source: not_present_in_supplied_extrinsics
  model: pinhole
  intrinsics:
    # Fill from the live D435i /camera/color/camera_info at the selected mode.
    fx: 0.0
    fy: 0.0
    cx: 0.0
    cy: 0.0
  distortion:
    model: from_camera_info
    coefficients: []
  lidar_to_camera:
    # Imported T_camera_from_lidar from the user-provided D435i calibration.
    translation_m: [0.10970761, 0.67284314, 0.27480904]
    rotation_rpy_rad: [-1.935569001, 0.007663065, -3.131491315]
    rotation_convention: zyx_euler_roll_pitch_yaw
  validation:
    method: "read-only import of D435i/MID-360 targetless extrinsics; live CameraInfo and time offset pending"
    calibration_date_utc: "not_provided"
    reprojection_rmse_px: null
    sample_count: 0
