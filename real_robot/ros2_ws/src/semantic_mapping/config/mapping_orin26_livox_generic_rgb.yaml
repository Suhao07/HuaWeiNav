# Orin-26 deployment profile.  It intentionally refuses semantic fusion until
# the separate projection asset is physically calibrated.
semantic_mapping_node:
  ros__parameters:
    platform: mecanum
    detection_linear_state_time_bias: 0.0
    detection_angular_state_time_bias: 0.0
    image_processing_interval: 0.5
    visualize: false
    vis_interval: 0.5
    annotate_image: false
    grounding_score_thresh: 0.35
    target_object: refrigerator
    object_file: src/semantic_mapping/semantic_mapping/config/objects.yaml
    require_calibration: true

detection_node:
  ros__parameters:
    platform: mecanum
    image_processing_interval: 0.5
    visualize: false
    vis_interval: 0.5
    annotate_image: false
    grounding_score_thresh: 0.35
    target_object: refrigerator
    object_file: src/semantic_mapping/semantic_mapping/config/objects.yaml
