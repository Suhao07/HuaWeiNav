# Do not mark this profile as calibrated until a board/target-based LiDAR-RGB
# calibration has been recorded and its reprojection error is documented.
# The transform convention is p_camera = R_lidar_to_camera @ p_lidar + t.
camera_projection:
  calibration_status: uncalibrated
  # These provenance fields are retained with the calibrated asset.  They are
  # not used to transform points, but make a robot profile auditable.
  calibration_version: 1
  sensor_topics:
    rgb: /camera/image
    lidar: /cloud_registered
    odom: /aft_mapped_to_init
  frame_ids:
    # Replace these after checking actual message headers / TF.
    lidar: livox_frame
    camera_optical: camera_color_optical_frame
  # Positive means the RGB timestamp is later than the LiDAR timestamp.
  rgb_minus_lidar_time_offset_s: 0.0
  model: pinhole
  image:
    width: 1920
    height: 1080
  intrinsics:
    # Temporary user-provided camera_x001 intrinsics.  The profile remains
    # uncalibrated until the LiDAR-to-camera/time-offset validation is complete.
    fx: 749.2058
    fy: 749.2058
    cx: 1003.1
    cy: 526.5258
  # Keep the distortion record together with the pinhole values.  The current
  # projection path expects rectified RGB; rectify upstream if coefficients are
  # non-zero, rather than silently applying an unsupported distortion model.
  distortion:
    model: plumb_bob
    coefficients: [1.5847e-5, -1.3585e-7, 0.0, 0.0, 4.7386e-11]
  lidar_to_camera:
    # Replace with the measured MID-360 -> RGB optical-frame transform.
    translation_m: [0.0, 0.0, 0.0]
    rotation_rpy_rad: [0.0, 0.0, 0.0]
  min_depth_m: 0.05
  validation:
    # Fill these from the calibration report before changing status above.
    method: "user-provided camera_x001 intrinsics; LiDAR extrinsics pending validation"
    calibration_date_utc: ""
    reprojection_rmse_px: 0.69
    sample_count: 0
