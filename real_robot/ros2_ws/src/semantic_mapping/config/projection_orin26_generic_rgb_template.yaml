# USB-camera profile.  Do not copy the D435i extrinsic into this file: the
# Generic USB camera is a different sensor and has no validated LiDAR-RGB
# transform yet.  Do not mark this profile as calibrated until a
# USB-camera-specific calibration has been recorded.
# The transform convention is p_camera = R_lidar_to_camera @ p_lidar + t.
camera_projection:
  calibration_status: uncalibrated
  # These provenance fields are retained with the calibrated asset.  They are
  # not used to transform points, but make a robot profile auditable.
  calibration_version: 1
  sensor_topics:
    rgb: /camera/image
    lidar: /cloud_registered
    odom: /aft_mapped_to_init
  frame_ids:
    # The usb_cam node currently publishes frame_id=default_cam.  Keep the
    # live source explicit; this is not the D435i optical frame.
    lidar: livox_frame
    camera_optical: default_cam
    camera_sensor: camera_x001_usb
  # Positive means the RGB timestamp is later than the LiDAR timestamp.  No
  # RGB-LiDAR measurement was included with camera_x001, so zero is only an
  # initial assumption and must not be treated as calibrated.
  rgb_minus_lidar_time_offset_s: 0.0
  time_offset_status: assumed_zero_unvalidated
  time_offset_source: not_provided_for_usb_camera
  model: pinhole
  image:
    width: 1920
    height: 1080
  intrinsics:
    # Temporary user-provided camera_x001 intrinsics.  The profile remains
    # uncalibrated until the LiDAR-to-camera/time-offset validation is complete.
    fx: 749.2058
    fy: 749.2058
    cx: 1003.1
    cy: 526.5258
  # Keep the distortion record together with the pinhole values.  The current
  # projection path expects rectified RGB; rectify upstream if coefficients are
  # non-zero, rather than silently applying an unsupported distortion model.
  distortion:
    model: plumb_bob
    coefficients: [1.5847e-5, -1.3585e-7, 0.0, 0.0, 4.7386e-11]
  lidar_to_camera:
    # USB-camera transform is intentionally empty.  The matrix in
    # orin26_d435i_mid360_targetless_v009_r009_extrinsics.json belongs to the
    # D435i sensor and is stored in the separate D435i profile.
    translation_m: [0.0, 0.0, 0.0]
    rotation_rpy_rad: [0.0, 0.0, 0.0]
  min_depth_m: 0.05
  validation:
    # Fill these from the calibration report before changing status above.
    method: "user-provided camera_x001 intrinsics; USB-camera LiDAR extrinsics pending"
    calibration_date_utc: ""
    reprojection_rmse_px: 0.69
    sample_count: 0
